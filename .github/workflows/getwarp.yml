name: Get WARP
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate WARP
        run: |
          curl -sSL https://githubusercontent.com | bash
      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: warp-config
          path: "*.conf"
          
